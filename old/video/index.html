<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bathyscaphe.be</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: white;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #logo {
            position: absolute;
            top: 30vh;
            left: 0px;
            z-index: 1;
            opacity: 0.7; /* Réglez la valeur d'opacité selon vos préférences (0 = transparent, 1 = opaque) */
            width:100vw;
        }
    </style>
</head>
<body>
    <video autoplay loop muted>
        <source src="votre_video.mp4" type="video/mp4">
        <!-- Ajoutez les différents formats de vidéo (webm, ogg, etc.) pour une compatibilité maximale -->
    </video>

    <img id="logo" src="votre_logo.png" alt="Votre Logo">
</body>
</html>
