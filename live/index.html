<!doctype html>
<html lang="en">

<head>
  <title>live</title>
  <link rel="stylesheet" href="video-js.css">
  <style type="text/css">
    img {
      border: 0px;
    }
  </style>
</head>

<body>
  <h1 id="title">DOMAIN_REPLACE</h1>
  <video id="video" src='https://88.99.27.167/hls/kievu_src.m3u8' class="video-js" controls preload="auto"  data-setup="{}"></video>
  <div id="instructions" style="display:none;">
    <h3>Live of Orson Claeys</h3>
  </div>

  <script src="jquery-slim.min.js"></script>
  <script src="video.js"></script>
  <script>
    $(function () {
      if (window.location.hash) {
        var name = window.location.hash.substr(1);
        console.log('playing "' + name + '"');
        $('#title').text('DOMAIN_REPLACE - ' + name);
        var v = videojs('video');
        v.src({ type: 'application/x-mpegURL', src: 'https://88.99.27.167/hls/kievu_src.m3u8' });
      } else {
        $('#video').hide();
        $('#instructions').show();
      }
    });
  </script>
</body>

</html>
